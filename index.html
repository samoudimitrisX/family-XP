        const COLORS = ['#667eea', '#4ECDC4', '#FFE66D', '#FF6B6B', '#95E1D3', '#F38181', '#FFB74D', '#A8E6CF', '#FF9999', '#99CCFF'];
        const SUGGESTED_TAGS = ['🛒 Τρόφιμα', '🏥 Υγεία', '🚗 Αυτοκίνητο', '💼 Δουλειά', '🎮 Ψυχαγωγία', '🏠 Σπίτι', '💝 Δώρα', '✈️ Ταξίδια'];

        function ExpenseTracker() {
            const [expenses, setExpenses] = useState([]);
            const [incomes, setIncomes] = useState([]);
            const [budgets, setBudgets] = useState({});
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState('Σούπερμάρκετ');
            const [incomeCategory, setIncomeCategory] = useState('Μισθός');
            const [customCategory, setCustomCategory] = useState('');
            const [person, setPerson] = useState('dimitris');
            const [note, setNote] = useState('');
            const [tags, setTags] = useState([]);
            const [tagInput, setTagInput] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [message, setMessage] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().split('T')[0].substring(0, 7));
            const [analyticsTab, setAnalyticsTab] = useState('trends');
            const [isExpense, setIsExpense] = useState(true);
            const fileInputRef = useRef(null);
            const chartRefs = useRef({});
            const chartInstances = useRef({});

            useEffect(() => {
                const saved = localStorage.getItem('family_finances_ultimate');
                if (saved) {
                    const data = JSON.parse(saved);
                    setExpenses(data.expenses || []);
                    setIncomes(data.incomes || []);
                    setBudgets(data.budgets || {});
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('family_finances_ultimate', JSON.stringify({ expenses, incomes, budgets }));
            }, [expenses, incomes, budgets]);

            useEffect(() => {
                if (activeTab === 'dashboard') {
                    setTimeout(() => updateCharts(), 100);
                }
            }, [activeTab, expenses, incomes, selectedMonth]);

            useEffect(() => {
                if (activeTab === 'analytics') {
                    setTimeout(() => updateAnalyticsCharts(), 100);
                }
            }, [activeTab, expenses, incomes, analyticsTab, selectedMonth]);

            const addTransaction = () => {
                if (!amount || isNaN(amount)) {
                    setMessage({ type: 'error', text: 'Εισάγετε έγκυρο ποσό' });
                    return;
                }

                if (isExpense) {
                    const finalCategory = customCategory.trim() || category;
                    const newExpense = {
                        id: Date.now(),
                        amount: parseFloat(amount),
                        category: finalCategory,
                        person,
                        note,
                        tags,
                        date,
                        type: 'expense'
                    };
                    setExpenses([newExpense, ...expenses]);
                } else {
                    const newIncome = {
                        id: Date.now(),
                        amount: parseFloat(amount),
                        category: incomeCategory,
                        person,
                        note,
                        tags,
                        date,
                        type: 'income'
                    };
                    setIncomes([newIncome, ...incomes]);
                }

                setAmount('');
                setCustomCategory('');
                setNote('');
                setTags([]);
                setDate(new Date().toISOString().split('T')[0]);
                const savedAmount = parseFloat(amount).toFixed(2);
                setMessage({ type: 'success', text: isExpense ? `Προστέθηκε έξοδο €${savedAmount}!` : `Προστέθηκε έσοδο €${savedAmount}!` });
                setTimeout(() => setMessage(''), 3000);
            };

            const addTag = () => {
                if (tagInput.trim() && !tags.includes(tagInput.trim())) {
                    setTags([...tags, tagInput.trim()]);
                    setTagInput('');
                }
            };

            const removeTag = (tag) => {
                setTags(tags.filter(t => t !== tag));
            };

            const deleteTransaction = (id, isExp) => {
                if (isExp) {
                    setExpenses(expenses.filter(e => e.id !== id));
                } else {
                    setIncomes(incomes.filter(i => i.id !== id));
                }
            };

            const getTotalByMonth = (month, isExp) => {
                const data = isExp ? expenses : incomes;
                return data.filter(e => e.date.startsWith(month)).reduce((sum, e) => sum + e.amount, 0);
            };

            const getTotalByYear = (year, isExp) => {
                const data = isExp ? expenses : incomes;
                return data.filter(e => e.date.startsWith(year)).reduce((sum, e) => sum + e.amount, 0);
            };

            const getExpensesByCategory = (month) => {
                const totals = {};
                expenses.filter(e => e.date.startsWith(month)).forEach(e => {
                    if (!totals[e.category]) totals[e.category] = 0;
                    totals[e.category] += e.amount;
                });
                return totals;
            };

            const getExpensesByPerson = (month) => {
                const totals = {};
                PEOPLE.forEach(p => {
                    totals[p.id] = expenses.filter(e => e.person === p.id && e.date.startsWith(month)).reduce((sum, e) => sum + e.amount, 0);
                });
                return totals;
            };

            const getLast12Months = () => {
                const months = [];
                for (let i = 11; i >= 0; i--) {
                    const date = new Date();
                    date.setMonth(date.getMonth() - i);
                    months.push(date.toISOString().split('T')[0].substring(0, 7));
                }
                return months;
            };

            const getLast6Months = () => {
                const months = [];
                for (let i = 5; i >= 0; i--) {
                    const date = new Date();
                    date.setMonth(date.getMonth() - i);
                    months.push(date.toISOString().split('T')[0].substring(0, 7));
                }
                return months;
            };

            const getWeeklyBreakdown = (month) => {
                const monthExpenses = expenses.filter(e => e.date.startsWith(month));
                const weeks = [0, 0, 0, 0, 0];

                monthExpenses.forEach(e => {
                    const day = parseInt(e.date.split('-')[2]);
                    const week = Math.floor((day - 1) / 7);
                    if (week < 5) weeks[week] += e.amount;
                });

                return weeks;
            };

            const getAverageMonthlySpending = () => {
                const last12 = getLast12Months();
                const total = last12.reduce((sum, m) => sum + getTotalByMonth(m, true), 0);
                return (total / 12).toFixed(2);
            };

            const forecastMonthEnd = (month) => {
                const monthExpenses = expenses.filter(e => e.date.startsWith(month));
                if (monthExpenses.length === 0) return 0;

                const currentDay = new Date().getDate();
                const currentTotal = getTotalByMonth(month, true);
                const daysInMonth = new Date(month.split('-')[0], parseInt(month.split('-')[1]), 0).getDate();

                return (currentTotal / currentDay * daysInMonth).toFixed(2);
            };

            const getCategoryRanking = (month) => {
                const categories = getExpensesByCategory(month);
                return Object.entries(categories)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10);
            };

            const updateCharts = () => {
                if (chartRefs.current.trend) {
                    const last12 = getLast12Months();
                    const expenseData = last12.map(m => getTotalByMonth(m, true));
                    const incomeData = last12.map(m => getTotalByMonth(m, false));
                    const labels = last12.map(m => new Date(m + '-01').toLocaleDateString('el-GR', { month: 'short' }));

                    if (chartInstances.current.trend) chartInstances.current.trend.destroy();

                    chartInstances.current.trend = new Chart(chartRefs.current.trend, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: 'Εισόδημα (€)',
                                    data: incomeData,
                                    borderColor: '#4caf50',
                                    backgroundColor: 'rgba(76, 175, 80, 0.1)',
                                    borderWidth: 3,
                                    fill: true,
                                    tension: 0.4,
                                    pointRadius: 5,
                                    pointHoverRadius: 7
                                },
                                {
                                    label: 'Έξοδα (€)',
                                    data: expenseData,
                                    borderColor: '#f44336',
                                    backgroundColor: 'rgba(244, 67, 54, 0.1)',
                                    borderWidth: 3,
                                    fill: true,
                                    tension: 0.4,
                                    pointRadius: 5,
                                    pointHoverRadius: 7
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }

                if (chartRefs.current.category) {
                    const categoryData = getExpensesByCategory(selectedMonth);
                    const topCats = Object.entries(categoryData).sort((a, b) => b[1] - a[1]).slice(0, 8);

                    if (chartInstances.current.category) chartInstances.current.category.destroy();

                    chartInstances.current.category = new Chart(chartRefs.current.category, {
                        type: 'doughnut',
                        data: {
                            labels: topCats.map(e => e[0]),
                            datasets: [{
                                data: topCats.map(e => e[1]),
                                backgroundColor: COLORS,
                                borderColor: 'white',
                                borderWidth: 3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }

                if (chartRefs.current.person) {
                    const personData = getExpensesByPerson(selectedMonth);

                    if (chartInstances.current.person) chartInstances.current.person.destroy();

                    chartInstances.current.person = new Chart(chartRefs.current.person, {
                        type: 'bar',
                        data: {
                            labels: PEOPLE.map(p => p.name),
                            datasets: [{
                                label: 'Έξοδα (€)',
                                data: PEOPLE.map(p => personData[p.id]),
                                backgroundColor: ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181'],
                                borderRadius: 10
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }
            };

            const updateAnalyticsCharts = () => {
                if (chartRefs.current.weekly && analyticsTab === 'trends') {
                    const weeks = getWeeklyBreakdown(selectedMonth);
                    const labels = ['Εβδ. 1', 'Εβδ. 2', 'Εβδ. 3', 'Εβδ. 4', 'Εβδ. 5'];

                    if (chartInstances.current.weekly) chartInstances.current.weekly.destroy();

                    chartInstances.current.weekly = new Chart(chartRefs.current.weekly, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: 'Εβδομαδιαία Έξοδα (€)',
                                data: weeks,
                                backgroundColor: 'rgba(102, 126, 234, 0.7)',
                                borderColor: '#667eea',
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }

                if (chartRefs.current.categoryTrend && analyticsTab === 'categories') {
                    const months = getLast6Months();
                    const categoryData = getExpensesByCategory(selectedMonth);
                    const topCats = Object.entries(categoryData).sort((a, b) => b[1] - a[1]).slice(0, 5);

                    const datasets = topCats.map((cat, idx) => ({
                        label: cat[0],
                        data: months.map(m => getExpensesByCategory(m)[cat[0]] || 0),
                        borderColor: COLORS[idx],
                        backgroundColor: COLORS[idx] + '33',
                        borderWidth: 2,
                        tension: 0.4
                    }));

                    if (chartInstances.current.categoryTrend) chartInstances.current.categoryTrend.destroy();

                    const labels = months.map(m => new Date(m + '-01').toLocaleDateString('el-GR', { month: 'short' }));

                    chartInstances.current.categoryTrend = new Chart(chartRefs.current.categoryTrend, {
                        type: 'line',
                        data: { labels, datasets },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }

                if (chartRefs.current.comparison && analyticsTab === 'comparison') {
                    const last6 = getLast6Months();
                    const expData = last6.map(m => getTotalByMonth(m, true));
                    const incData = last6.map(m => getTotalByMonth(m, false));
                    const labels = last6.map(m => new Date(m + '-01').toLocaleDateString('el-GR', { month: 'short' }));

                    if (chartInstances.current.comparison) chartInstances.current.comparison.destroy();

                    chartInstances.current.comparison = new Chart(chartRefs.current.comparison, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: 'Εισόδημα',
                                    data: incData,
                                    backgroundColor: '#4caf50',
                                    borderRadius: 8
                                },
                                {
                                    label: 'Έξοδα',
                                    data: expData,
                                    backgroundColor: '#f44336',
                                    borderRadius: 8
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }
            };

            const currentMonthExpense = getTotalByMonth(selectedMonth, true);
            const currentMonthIncome = getTotalByMonth(selectedMonth, false);
            const currentMonthBalance = currentMonthIncome - currentMonthExpense;

            const currentYear = selectedMonth.split('-')[0];
            const annualExpense = getTotalByYear(currentYear, true);
            const annualIncome = getTotalByYear(currentYear, false);
            const annualBalance = annualIncome - annualExpense;

            const prevMonth = new Date(selectedMonth + '-01');
            prevMonth.setMonth(prevMonth.getMonth() - 1);
            const prevMonthStr = prevMonth.toISOString().split('T')[0].substring(0, 7);
            const prevMonthExpense = getTotalByMonth(prevMonthStr, true);

            const expensesByCategory = getExpensesByCategory(selectedMonth);
            const expensesByPerson = getExpensesByPerson(selectedMonth);
            const currentMonthExpenses = expenses.filter(e => e.date.startsWith(selectedMonth)).sort((a, b) => new Date(b.date) - new Date(a.date));
            const currentMonthIncomes = incomes.filter(i => i.date.startsWith(selectedMonth)).sort((a, b) => new Date(b.date) - new Date(a.date));

            const dailyAverage = currentMonthExpenses.length > 0 ? (currentMonthExpense / currentMonthExpenses.length).toFixed(2) : 0;
            const topExpense = currentMonthExpenses.length > 0 ? Math.max(...currentMonthExpenses.map(e => e.amount)).toFixed(2) : 0;
            const avgPerCategory = Object.keys(expensesByCategory).length > 0 ? (currentMonthExpense / Object.keys(expensesByCategory).length).toFixed(2) : 0;
            const weeklyData = getWeeklyBreakdown(selectedMonth);
            const weeklyAverage = weeklyData.length > 0 ? (currentMonthExpense / weeklyData.length).toFixed(2) : 0;

            const exportToExcel = () => {
                try {
                    if (typeof XLSX === 'undefined') {
                        setMessage({ type: 'error', text: 'Η βιβλιοθήκη Excel δεν φορτώθηκε. Ελέγξτε τη σύνδεση.' });
                        return;
                    }
                    const wb = XLSX.utils.book_new();

                    // Sheet 1: Summary (last 12 months)
                    const summaryRows = [['Μήνας', 'Έξοδα', 'Εισόδημα', 'Υπόλοιπο']];
                    getLast12Months().forEach(m => {
                        const exp = expenses.filter(e => e.date.startsWith(m)).reduce((s, e) => s + e.amount, 0);
                        const inc = incomes.filter(i => i.date.startsWith(m)).reduce((s, i) => s + i.amount, 0);
                        const label = new Date(m + '-01').toLocaleDateString('el-GR', { month: 'long', year: 'numeric' });
                        summaryRows.push([label, exp.toFixed(2), inc.toFixed(2), (inc - exp).toFixed(2)]);
                    });
                    const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
                    XLSX.utils.book_append_sheet(wb, ws1, 'Σύνοψη');

                    // Sheet 2: Categories (current month)
                    const catRows = [['Κατηγορία', 'Σύνολο', 'Πλήθος']];
                    Object.entries(expensesByCategory).sort((a, b) => b[1] - a[1]).forEach(([cat, total]) => {
                        const count = currentMonthExpenses.filter(e => e.category === cat).length;
                        catRows.push([cat, total.toFixed(2), count]);
                    });
                    const ws2 = XLSX.utils.aoa_to_sheet(catRows);
                    XLSX.utils.book_append_sheet(wb, ws2, 'Κατηγορίες');

                    // Sheet 3: All transactions
                    const txRows = [['Ημερομηνία', 'Τύπος', 'Κατηγορία', 'Ποσό', 'Άτομο', 'Σημείωση']];
                    expenses.forEach(e => {
                        txRows.push([e.date, 'Έξοδο', e.category, e.amount.toFixed(2), (PEOPLE.find(p => p.id === e.person)?.name) || e.person || '-', e.note || '']);
                    });
                    incomes.forEach(i => {
                        txRows.push([i.date, 'Εισόδημα', i.category, i.amount.toFixed(2), (PEOPLE.find(p => p.id === i.person)?.name) || i.person || '-', i.note || '']);
                    });
                    const ws3 = XLSX.utils.aoa_to_sheet(txRows);
                    XLSX.utils.book_append_sheet(wb, ws3, 'Συναλλαγές');

                    XLSX.writeFile(wb, `Οικονομικά_${new Date().toISOString().split('T')[0]}.xlsx`);
                    setMessage({ type: 'success', text: '✅ Το Excel κατέβηκε!' });
                    setTimeout(() => setMessage(''), 3000);
                } catch (error) {
                    console.error('Excel error:', error);
                    setMessage({ type: 'error', text: 'Σφάλμα Excel: ' + error.message });
                }
            };

            // Transliterate Greek to Latin so text is readable in the core PDF font
            const greekToLatin = (str) => {
                if (str === null || str === undefined) return '';
                const map = {
                    'Α':'A','Β':'V','Γ':'G','Δ':'D','Ε':'E','Ζ':'Z','Η':'I','Θ':'Th','Ι':'I','Κ':'K','Λ':'L','Μ':'M','Ν':'N','Ξ':'X','Ο':'O','Π':'P','Ρ':'R','Σ':'S','Τ':'T','Υ':'Y','Φ':'F','Χ':'Ch','Ψ':'Ps','Ω':'O',
                    'α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o',
                    'ά':'a','έ':'e','ή':'i','ί':'i','ό':'o','ύ':'y','ώ':'o','ϊ':'i','ϋ':'y','ΐ':'i','ΰ':'y','Ά':'A','Έ':'E','Ή':'I','Ί':'I','Ό':'O','Ύ':'Y','Ώ':'O'
                };
                return str.toString().split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('');
            };

            const exportToPDF = () => {
                try {
                    if (!window.jspdf) {
                        setMessage({ type: 'error', text: 'Η βιβλιοθήκη PDF δεν φορτώθηκε. Ελέγξτε τη σύνδεση.' });
                        return;
                    }
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    const runAutoTable = (opts) => {
                        if (typeof doc.autoTable === 'function') doc.autoTable(opts);
                        else if (window.jspdf && typeof window.jspdf.autoTable === 'function') window.jspdf.autoTable(doc, opts);
                        else throw new Error('autoTable plugin not loaded');
                    };

                    const purple = [102, 126, 234];
                    const sectionTitle = (txt, y) => {
                        doc.setFontSize(13);
                        doc.setTextColor(102, 126, 234);
                        doc.text(txt, 15, y);
                        doc.setTextColor(0, 0, 0);
                    };

                    // ===== HEADER =====
                    doc.setFontSize(18);
                    doc.text('Family Expenses', 15, 15);
                    doc.setFontSize(10);
                    doc.setTextColor(120, 120, 120);
                    doc.text('Export: ' + new Date().toLocaleDateString('en-GB'), 15, 22);
                    doc.setTextColor(0, 0, 0);

                    // ===== SECTION 1: 12-MONTH SUMMARY (mirrors Excel sheet 1) =====
                    sectionTitle('12-Month Summary', 32);
                    const summaryBody = getLast12Months().map(m => {
                        const exp = expenses.filter(e => e.date.startsWith(m)).reduce((s, e) => s + e.amount, 0);
                        const inc = incomes.filter(i => i.date.startsWith(m)).reduce((s, i) => s + i.amount, 0);
                        const label = new Date(m + '-01').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
                        return [label, exp.toFixed(2), inc.toFixed(2), (inc - exp).toFixed(2)];
                    });
                    runAutoTable({
                        head: [['Month', 'Expenses', 'Income', 'Balance']],
                        body: summaryBody,
                        startY: 36,
                        theme: 'grid',
                        headStyles: { fillColor: purple },
                        styles: { fontSize: 9 }
                    });

                    // ===== SECTION 2: CATEGORIES (all-time, so it's never empty) =====
                    const allCatTotals = {};
                    expenses.forEach(e => { allCatTotals[e.category] = (allCatTotals[e.category] || 0) + e.amount; });
                    const catBody = Object.entries(allCatTotals).sort((a, b) => b[1] - a[1]).map(([cat, total]) => {
                        const count = expenses.filter(e => e.category === cat).length;
                        return [greekToLatin(cat), total.toFixed(2), count];
                    });
                    if (catBody.length > 0) {
                        sectionTitle('Expenses by Category (all)', doc.lastAutoTable.finalY + 14);
                        runAutoTable({
                            head: [['Category', 'Total (EUR)', 'Count']],
                            body: catBody,
                            startY: doc.lastAutoTable.finalY + 18,
                            theme: 'grid',
                            headStyles: { fillColor: purple },
                            styles: { fontSize: 9 }
                        });
                    }

                    // ===== SECTION 3: ALL TRANSACTIONS (mirrors Excel sheet 3) =====
                    const txBody = [
                        ...expenses.map(e => ({ ...e, _type: 'Expense' })),
                        ...incomes.map(i => ({ ...i, _type: 'Income' }))
                    ].sort((a, b) => new Date(b.date) - new Date(a.date))
                     .map(t => [
                        t.date,
                        t._type,
                        greekToLatin(t.category),
                        (PEOPLE.find(p => p.id === t.person)?.name ? greekToLatin(PEOPLE.find(p => p.id === t.person).name) : (t.person || '-')),
                        t.amount.toFixed(2),
                        greekToLatin(t.note || '')
                     ]);
                    if (txBody.length > 0) {
                        sectionTitle('All Transactions', doc.lastAutoTable.finalY + 14);
                        runAutoTable({
                            head: [['Date', 'Type', 'Category', 'Person', 'Amount', 'Note']],
                            body: txBody,
                            startY: doc.lastAutoTable.finalY + 18,
                            theme: 'striped',
                            headStyles: { fillColor: purple },
                            styles: { fontSize: 8 },
                            columnStyles: { 5: { cellWidth: 40 } }
                        });
                    }

                    doc.save(`Finances_${new Date().toISOString().split('T')[0]}.pdf`);
                    setMessage({ type: 'success', text: '✅ Το PDF κατέβηκε!' });
                    setTimeout(() => setMessage(''), 3000);
                } catch (error) {
                    console.error('PDF error:', error);
                    setMessage({ type: 'error', text: 'Σφάλμα PDF: ' + error.message });
                }
            };

            const exportData = () => {
                const data = { expenses, incomes, budgets, exportDate: new Date().toISOString() };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `οικονομικά_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                setMessage({ type: 'success', text: 'Δεδομένα εξαγόμενα!' });
            };

            const importData = (e) => {
                const file = e.target.files[0];

                                        })()}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'monthly' && (
                            <div className="card">
                                <h2>📆 Μηνιαία Αναφορά</h2>

                                <table>
                                    <thead>
                                        <tr>
                                            <th>Μήνας</th>
                                            <th>Συναλλαγές</th>
                                            <th>Έξοδα (€)</th>
                                            <th>Εισόδημα (€)</th>
                                            <th>Υπόλοιπο (€)</th>
                                            <th>Μέσο/Ημέρα (€)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {getLast12Months().map(month => {
                                            const monthExpense = getTotalByMonth(month, true);
                                            const monthIncome = getTotalByMonth(month, false);
                                            const monthTransactions = expenses.filter(e => e.date.startsWith(month)).length + incomes.filter(i => i.date.startsWith(month)).length;
                                            const daysInMonth = new Date(month.split('-')[0], parseInt(month.split('-')[1]), 0).getDate();
                                            const avgPerDay = monthExpense > 0 ? (monthExpense / daysInMonth).toFixed(2) : '0.00';

                                            return (
                                                <tr key={month}>
                                                    <td>{new Date(month + '-01').toLocaleDateString('el-GR', { month: 'long', year: 'numeric' })}</td>
                                                    <td>{monthTransactions}</td>
                                                    <td><span className="amount-negative">€{monthExpense.toFixed(2)}</span></td>
                                                    <td><span className="amount-positive">€{monthIncome.toFixed(2)}</span></td>
                                                    <td style={{ color: monthIncome - monthExpense >= 0 ? '#4caf50' : '#f44336', fontWeight: 700 }}>€{(monthIncome - monthExpense).toFixed(2)}</td>
                                                    <td>€{avgPerDay}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'list' && (
                            <div className="card">
                                <h2>📝 Λίστα Συναλλαγών - {new Date(selectedMonth + '-01').toLocaleDateString('el-GR', { month: 'long', year: 'numeric' })}</h2>

                                <table>
                                    <thead>
                                        <tr>
                                            <th>Ημερομηνία</th>
                                            <th>Τύπος</th>
                                            <th>Κατηγορία</th>
                                            <th>Ποσό (€)</th>
                                            <th>Άτομο</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {[...currentMonthExpenses, ...currentMonthIncomes].sort((a, b) => new Date(b.date) - new Date(a.date)).map(trans => (
                                            <tr key={trans.id}>
                                                <td>{new Date(trans.date).toLocaleDateString('el-GR')}</td>
                                                <td>{trans.type === 'expense' ? '❌ Έξοδο' : '💚 Εισόδημα'}</td>
                                                <td>{trans.category}</td>
                                                <td><span className={trans.type === 'expense' ? 'amount-negative' : 'amount-positive'}>€{trans.amount.toFixed(2)}</span></td>
                                                <td>{PEOPLE.find(p => p.id === trans.person)?.name || '-'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ExpenseTracker />);
    </script>
</body>
</html>
