                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }
            };

            const updateAnalyticsCharts = () => {
                if (chartRefs.current.weekly && analyticsTab === 'trends') {
                    const weeks = getWeeklyBreakdown(selectedMonth);
                    const labels = ['Εβδ. 1', 'Εβδ. 2', 'Εβδ. 3', 'Εβδ. 4', 'Εβδ. 5'];

                    if (chartInstances.current.weekly) chartInstances.current.weekly.destroy();

                    chartInstances.current.weekly = new Chart(chartRefs.current.weekly, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: 'Εβδομαδιαία Έξοδα (€)',
                                data: weeks,
                                backgroundColor: 'rgba(102, 126, 234, 0.7)',
                                borderColor: '#667eea',
                                borderWidth: 2,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }

                if (chartRefs.current.categoryTrend && analyticsTab === 'categories') {
                    const months = getLast6Months();
                    const categoryData = getExpensesByCategory(selectedMonth);
                    const topCats = Object.entries(categoryData).sort((a, b) => b[1] - a[1]).slice(0, 5);

                    const datasets = topCats.map((cat, idx) => ({
                        label: cat[0],
                        data: months.map(m => getExpensesByCategory(m)[cat[0]] || 0),
                        borderColor: COLORS[idx],
                        backgroundColor: COLORS[idx] + '33',
                        borderWidth: 2,
                        tension: 0.4
                    }));

                    if (chartInstances.current.categoryTrend) chartInstances.current.categoryTrend.destroy();

                    const labels = months.map(m => new Date(m + '-01').toLocaleDateString('el-GR', { month: 'short' }));

                    chartInstances.current.categoryTrend = new Chart(chartRefs.current.categoryTrend, {
                        type: 'line',
                        data: { labels, datasets },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }

                if (chartRefs.current.comparison && analyticsTab === 'comparison') {
                    const last6 = getLast6Months();
                    const expData = last6.map(m => getTotalByMonth(m, true));
                    const incData = last6.map(m => getTotalByMonth(m, false));
                    const labels = last6.map(m => new Date(m + '-01').toLocaleDateString('el-GR', { month: 'short' }));

                    if (chartInstances.current.comparison) chartInstances.current.comparison.destroy();

                    chartInstances.current.comparison = new Chart(chartRefs.current.comparison, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: 'Εισόδημα',
                                    data: incData,
                                    backgroundColor: '#4caf50',
                                    borderRadius: 8
                                },
                                {
                                    label: 'Έξοδα',
                                    data: expData,
                                    backgroundColor: '#f44336',
                                    borderRadius: 8
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } },
                            scales: { y: { beginAtZero: true, ticks: { callback: v => '€' + v.toFixed(0) } } }
                        }
                    });
                }
            };

            const currentMonthExpense = getTotalByMonth(selectedMonth, true);
            const currentMonthIncome = getTotalByMonth(selectedMonth, false);
            const currentMonthBalance = currentMonthIncome - currentMonthExpense;

            const currentYear = selectedMonth.split('-')[0];
            const annualExpense = getTotalByYear(currentYear, true);
            const annualIncome = getTotalByYear(currentYear, false);
            const annualBalance = annualIncome - annualExpense;

            const prevMonth = new Date(selectedMonth + '-01');
            prevMonth.setMonth(prevMonth.getMonth() - 1);
            const prevMonthStr = prevMonth.toISOString().split('T')[0].substring(0, 7);
            const prevMonthExpense = getTotalByMonth(prevMonthStr, true);

            const expensesByCategory = getExpensesByCategory(selectedMonth);
            const expensesByPerson = getExpensesByPerson(selectedMonth);
            const currentMonthExpenses = expenses.filter(e => e.date.startsWith(selectedMonth)).sort((a, b) => new Date(b.date) - new Date(a.date));
            const currentMonthIncomes = incomes.filter(i => i.date.startsWith(selectedMonth)).sort((a, b) => new Date(b.date) - new Date(a.date));

            const dailyAverage = currentMonthExpenses.length > 0 ? (currentMonthExpense / currentMonthExpenses.length).toFixed(2) : 0;
            const topExpense = currentMonthExpenses.length > 0 ? Math.max(...currentMonthExpenses.map(e => e.amount)).toFixed(2) : 0;
            const avgPerCategory = Object.keys(expensesByCategory).length > 0 ? (currentMonthExpense / Object.keys(expensesByCategory).length).toFixed(2) : 0;
            const weeklyData = getWeeklyBreakdown(selectedMonth);
            const weeklyAverage = weeklyData.length > 0 ? (currentMonthExpense / weeklyData.length).toFixed(2) : 0;

            const exportToExcel = () => {
                try {
                    if (typeof XLSX === 'undefined') {
                        setMessage({ type: 'error', text: 'Η βιβλιοθήκη Excel δεν φορτώθηκε. Ελέγξτε τη σύνδεση.' });
                        return;
                    }
                    const wb = XLSX.utils.book_new();

                    // Sheet 1: Summary (last 12 months)
                    const summaryRows = [['Μήνας', 'Έξοδα', 'Εισόδημα', 'Υπόλοιπο']];
                    getLast12Months().forEach(m => {
                        const exp = expenses.filter(e => e.date.startsWith(m)).reduce((s, e) => s + e.amount, 0);
                        const inc = incomes.filter(i => i.date.startsWith(m)).reduce((s, i) => s + i.amount, 0);
                        const label = new Date(m + '-01').toLocaleDateString('el-GR', { month: 'long', year: 'numeric' });
                        summaryRows.push([label, exp.toFixed(2), inc.toFixed(2), (inc - exp).toFixed(2)]);
                    });
                    const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
                    XLSX.utils.book_append_sheet(wb, ws1, 'Σύνοψη');

                    // Sheet 2: Categories (current month)
                    const catRows = [['Κατηγορία', 'Σύνολο', 'Πλήθος']];
                    Object.entries(expensesByCategory).sort((a, b) => b[1] - a[1]).forEach(([cat, total]) => {
                        const count = currentMonthExpenses.filter(e => e.category === cat).length;
                        catRows.push([cat, total.toFixed(2), count]);
                    });
                    const ws2 = XLSX.utils.aoa_to_sheet(catRows);
                    XLSX.utils.book_append_sheet(wb, ws2, 'Κατηγορίες');

                    // Sheet 3: All transactions
                    const txRows = [['Ημερομηνία', 'Τύπος', 'Κατηγορία', 'Ποσό', 'Άτομο', 'Σημείωση']];
                    expenses.forEach(e => {
                        txRows.push([e.date, 'Έξοδο', e.category, e.amount.toFixed(2), (PEOPLE.find(p => p.id === e.person)?.name) || e.person || '-', e.note || '']);
                    });
                    incomes.forEach(i => {
                        txRows.push([i.date, 'Εισόδημα', i.category, i.amount.toFixed(2), (PEOPLE.find(p => p.id === i.person)?.name) || i.person || '-', i.note || '']);
                    });
                    const ws3 = XLSX.utils.aoa_to_sheet(txRows);
                    XLSX.utils.book_append_sheet(wb, ws3, 'Συναλλαγές');

                    XLSX.writeFile(wb, `Οικονομικά_${fileStamp()}.xlsx`);
                    setMessage({ type: 'success', text: '✅ Το Excel κατέβηκε!' });
                    setTimeout(() => setMessage(''), 3000);
                } catch (error) {
                    console.error('Excel error:', error);
                    setMessage({ type: 'error', text: 'Σφάλμα Excel: ' + error.message });
                }
            };

            // Transliterate Greek to Latin so text is readable in the core PDF font
            const greekToLatin = (str) => {
                if (str === null || str === undefined) return '';
                const map = {
                    'Α':'A','Β':'V','Γ':'G','Δ':'D','Ε':'E','Ζ':'Z','Η':'I','Θ':'Th','Ι':'I','Κ':'K','Λ':'L','Μ':'M','Ν':'N','Ξ':'X','Ο':'O','Π':'P','Ρ':'R','Σ':'S','Τ':'T','Υ':'Y','Φ':'F','Χ':'Ch','Ψ':'Ps','Ω':'O',
                    'α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o',
                    'ά':'a','έ':'e','ή':'i','ί':'i','ό':'o','ύ':'y','ώ':'o','ϊ':'i','ϋ':'y','ΐ':'i','ΰ':'y','Ά':'A','Έ':'E','Ή':'I','Ί':'I','Ό':'O','Ύ':'Y','Ώ':'O'
                };
                return str.toString().split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('');
            };

            const exportToPDF = () => {
                try {
                    if (!window.jspdf) {
                        setMessage({ type: 'error', text: 'Η βιβλιοθήκη PDF δεν φορτώθηκε. Ελέγξτε τη σύνδεση.' });
                        return;
                    }
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    const runAutoTable = (opts) => {
                        if (typeof doc.autoTable === 'function') doc.autoTable(opts);
                        else if (window.jspdf && typeof window.jspdf.autoTable === 'function') window.jspdf.autoTable(doc, opts);
                        else throw new Error('autoTable plugin not loaded');
                    };

                    const purple = [102, 126, 234];
                    const sectionTitle = (txt, y) => {
                        doc.setFontSize(13);
                        doc.setTextColor(102, 126, 234);
                        doc.text(txt, 15, y);
                        doc.setTextColor(0, 0, 0);
                    };

                    // ===== HEADER =====
                    doc.setFontSize(18);
                    doc.text('Family Expenses', 15, 15);
                    doc.setFontSize(10);
                    doc.setTextColor(120, 120, 120);
                    doc.text('Export: ' + new Date().toLocaleDateString('en-GB'), 15, 22);
                    doc.setTextColor(0, 0, 0);

                    // ===== SECTION 1: 12-MONTH SUMMARY (mirrors Excel sheet 1) =====
                    sectionTitle('12-Month Summary', 32);
                    const summaryBody = getLast12Months().map(m => {
                        const exp = expenses.filter(e => e.date.startsWith(m)).reduce((s, e) => s + e.amount, 0);
                        const inc = incomes.filter(i => i.date.startsWith(m)).reduce((s, i) => s + i.amount, 0);
                        const label = new Date(m + '-01').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
                        return [label, exp.toFixed(2), inc.toFixed(2), (inc - exp).toFixed(2)];
                    });
                    runAutoTable({
                        head: [['Month', 'Expenses', 'Income', 'Balance']],
                        body: summaryBody,
                        startY: 36,
                        theme: 'grid',
                        headStyles: { fillColor: purple },
                        styles: { fontSize: 9 }
                    });

                    // ===== SECTION 2: CATEGORIES (all-time, so it's never empty) =====
                    const allCatTotals = {};
                    expenses.forEach(e => { allCatTotals[e.category] = (allCatTotals[e.category] || 0) + e.amount; });
                    const catBody = Object.entries(allCatTotals).sort((a, b) => b[1] - a[1]).map(([cat, total]) => {
                        const count = expenses.filter(e => e.category === cat).length;
                        return [greekToLatin(cat), total.toFixed(2), count];
                    });
                    if (catBody.length > 0) {
                        sectionTitle('Expenses by Category (all)', doc.lastAutoTable.finalY + 14);
                        runAutoTable({
                            head: [['Category', 'Total (EUR)', 'Count']],
                            body: catBody,
                            startY: doc.lastAutoTable.finalY + 18,
                            theme: 'grid',
                            headStyles: { fillColor: purple },
                            styles: { fontSize: 9 }
                        });
                    }

                    // ===== SECTION 3: ALL TRANSACTIONS (mirrors Excel sheet 3) =====
                    const txBody = [
                        ...expenses.map(e => ({ ...e, _type: 'Expense' })),
                        ...incomes.map(i => ({ ...i, _type: 'Income' }))
                    ].sort((a, b) => new Date(b.date) - new Date(a.date))
                     .map(t => [
                        t.date,
                        t._type,
                        greekToLatin(t.category),
                        (PEOPLE.find(p => p.id === t.person)?.name ? greekToLatin(PEOPLE.find(p => p.id === t.person).name) : (t.person || '-')),
                        t.amount.toFixed(2),
                        greekToLatin(t.note || '')
                     ]);
                    if (txBody.length > 0) {
                        sectionTitle('All Transactions', doc.lastAutoTable.finalY + 14);
                        runAutoTable({
                            head: [['Date', 'Type', 'Category', 'Person', 'Amount', 'Note']],
                            body: txBody,
                            startY: doc.lastAutoTable.finalY + 18,
                            theme: 'striped',
                            headStyles: { fillColor: purple },
                            styles: { fontSize: 8 },
                            columnStyles: { 5: { cellWidth: 40 } }
                        });
                    }

                    doc.save(`Finances_${fileStamp()}.pdf`);
                    setMessage({ type: 'success', text: '✅ Το PDF κατέβηκε!' });
                    setTimeout(() => setMessage(''), 3000);
                } catch (error) {
                    console.error('PDF error:', error);
                    setMessage({ type: 'error', text: 'Σφάλμα PDF: ' + error.message });
                }
            };

            // ===== EXCEL IMPORT (date | amount | description) =====
            // Smart map: description -> known category (Greek+English keywords), else keep as note
            const CATEGORY_KEYWORDS = {
                'Σούπερμάρκετ': ['supermarket', 'σουπερ', 'σούπερ', 'market', 'λαικη', 'λαϊκή', 'laika'],
                'Φούρνος': ['φουρνος', 'φούρνος', 'bakery', 'ψωμι'],
                'Περίπτερο': ['περιπτερο', 'περίπτερο', 'kiosk'],
                'Wolt': ['wolt', 'efood', 'delivery', 'ντελιβερι'],
                'Έξοδος': ['εξοδος', 'έξοδος', 'εξοδο', 'καφε', 'καφέ', 'coffee', 'cafe', 'caffe', 'ζορμπας', 'ζορμπάς', 'εστιατ', 'restaurant', 'μπαρ', 'bar'],
                'Βενζίνη': ['βενζινη', 'βενζίνη', 'καυσιμα', 'καύσιμα', 'petrol', 'gas', 'fuel', 'καυστικη', 'καυστική'],
                'Βενζίνη γραφείο': ['βενζινη γραφειο', 'for work', 'work fuel'],
                'Ρούχα': ['ρουχα', 'ρούχα', 'clothes', 'μπουφαν', 'μπουφάν'],
                'Μάνα': ['μανα', 'μάνα', 'mother', 'mama'],
                'Παπούτσια': ['παπουτσια', 'παπούτσια', 'shoes'],
                'Δάνειο': ['δανειο', 'δάνειο', 'loan'],
                'Ρεύμα': ['ρευμα', 'ρεύμα', 'αηκ', 'ahk', 'eac', 'electricity'],
                'Νερό': ['νερο', 'νερό', 'water'],
                'Κινητό': ['κινητο', 'κινητό', 'primetel', 'primtel', 'mobile', 'cyta', 'epic', 'mtn'],
                'Ίντερνετ': ['internet', 'ιντερνετ', 'ίντερνετ', 'cablenet', 'cablnet', 'net'],
                'Φάρμακα': ['φαρμακ', 'pharmacy', 'medicine', 'φαρμακειο', 'φαρμακείο'],
                'Netflix': ['netflix', 'νετφλιξ'],
                'Σέρβις Αυτοκινήτου': ['service', 'σερβις', 'σέρβις', 'car service', 'carwash', 'car wash', 'συνεργειο', 'συνεργείο'],
                'Ταξίδια': ['ταξιδ', 'trip', 'travel', 'flight', 'αεροπορικ'],
                'Δώρα': ['δωρο', 'δώρο', 'δωρα', 'δώρα', 'gift'],
                'Health Care': ['health', 'γιατρος', 'γιατρός', 'doctor', 'ιατρ', 'gym', 'γυμναστ'],
                'Πατέρας': ['πατερας', 'πατέρας', 'father', 'μπαμπα'],
                'Προσωπικά': ['προσωπικ', 'personal', 'κομμωτηριο', 'κομμωτήριο', 'κουρεμα', 'κούρεμα', 'κομμωτ'],
                'Unplanned': ['unplanned', 'εκτακτο', 'έκτακτο'],
                'Γραφείο': ['γραφειο', 'γραφείο', 'office', 'esteeldesign', 'steeldesign'],
                'Διάφορα': ['διαφορα', 'διάφορα', 'misc', 'other', 'αλλο', 'άλλο'],
                'Επιδιόρθωση Σπιτιού': ['επιδιορθωση', 'επιδιόρθωση', 'σπιτι', 'σπίτι', 'home repair', 'repair', 'for home'],
                'Φόροι Σπιτιού': ['φοροι', 'φόροι', 'tax', 'φορος', 'φόρος']
            };

            const matchCategory = (desc) => {
                if (!desc) return null;
                const d = desc.toString().trim().toLowerCase();
                // exact category name match first
                for (const cat of DEFAULT_EXPENSE_CATEGORIES) {
                    if (cat.toLowerCase() === d) return cat;
                }
                // keyword match
                for (const [cat, kws] of Object.entries(CATEGORY_KEYWORDS)) {
                    if (kws.some(k => d.includes(k))) return cat;
                }
                return null;
            };

            const parseImportDate = (val) => {
                if (!val) return null;
                if (val instanceof Date && !isNaN(val)) return val.toISOString().split('T')[0];
                const s = val.toString().trim();
                if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
                const m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
                if (m) {
                    let [, d, mo, y] = m;
                    if (y.length === 2) y = '20' + y;
                    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
                }
                const parsed = new Date(s);
                return isNaN(parsed) ? null : parsed.toISOString().split('T')[0];
            };

            const parseImportAmount = (val) => {
                if (val === null || val === undefined || val === '') return null;
                let s = val.toString().trim().replace(/[€$\s]/g, '');
                if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
                else if (s.includes(',')) s = s.replace(',', '.');
                const n = parseFloat(s);
                return isNaN(n) ? null : Math.abs(n);
            };

            const handleExcelImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (typeof XLSX === 'undefined') {
                    setMessage({ type: 'error', text: 'Η βιβλιοθήκη Excel δεν φορτώθηκε' });
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
                        if (rows.length === 0) { setMessage({ type: 'error', text: 'Άδειο αρχείο' }); return; }

                        // Find columns by header (flexible: date/amount/description in any language)
                        const headers = Object.keys(rows[0]);
                        const findCol = (opts) => headers.find(h => opts.some(o => h.toString().trim().toLowerCase().includes(o)));
                        const dateCol = findCol(['date', 'ημερ']);
                        const amountCol = findCol(['amount', 'ποσ', 'αξ']);
                        const descCol = findCol(['desc', 'περιγρ', 'κατηγ', 'αιτ']);

                        if (!dateCol || !amountCol) {
                            setMessage({ type: 'error', text: 'Δεν βρέθηκαν στήλες date/amount' });
                            setTimeout(() => setMessage(''), 3000);
                            return;
                        }

                        const valid = [];
                        let matched = 0, asNote = 0;
                        rows.forEach((row, idx) => {
                            const date = parseImportDate(row[dateCol]);
                            const amount = parseImportAmount(row[amountCol]);
                            const desc = descCol ? (row[descCol] || '').toString().trim() : '';
                            if (!date || amount === null || amount === 0) return;
                            const cat = matchCategory(desc);
                            if (cat) matched++; else if (desc) asNote++;
                            valid.push({
                                id: Date.now() + idx + Math.floor(Math.random() * 100000),
                                amount,
                                category: cat || 'Διάφορα',
                                person: 'family',
                                note: cat ? desc : (desc || ''), // keep original desc as note too
                                tags: [],
                                date,
                                type: 'expense',
                                receipt: null
                            });
                        });

                        if (valid.length === 0) {
                            setMessage({ type: 'error', text: 'Δεν βρέθηκαν έγκυρες εγγραφές' });
                            setTimeout(() => setMessage(''), 3000);
                            return;
                        }
                        setImportPreview({ rows: valid, matched, asNote });
                    } catch (err) {
                        console.error(err);
                        setMessage({ type: 'error', text: 'Σφάλμα ανάγνωσης: ' + err.message });
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            const confirmImport = () => {
                if (!importPreview) return;
                setExpenses([...importPreview.rows, ...expenses]);
                setMessage({ type: 'success', text: `✅ Εισήχθησαν ${importPreview.rows.length} έξοδα!` });
                setTimeout(() => setMessage(''), 3500);
                setImportPreview(null);
                setShowImportModal(false);
            };

            const exportData = () => {
                const data = { expenses, incomes, budgets, customCategories, exportDate: new Date().toISOString() };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_${fileStamp()}.json`;
                a.click();
                setMessage({ type: 'success', text: 'Δεδομένα εξαγόμενα!' });
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.expenses && data.incomes) {
                            setExpenses(data.expenses);
                            setIncomes(data.incomes);
                            setBudgets(data.budgets || {});
                            setMessage({ type: 'success', text: 'Δεδομένα εισαγόμενα επιτυχώς!' });
                        }
                    } catch (error) {
                        setMessage({ type: 'error', text: 'Σφάλμα εισαγωγής' });
                    }
                };
                reader.readAsText(file);
            };

            const handleImportClick = () => {
                fileInputRef.current.click();
            };

            const setBudget = (cat, amount) => {
                setBudgets({ ...budgets, [cat]: parseFloat(amount) });
            };

            const getBudgetStatus = (cat) => {
                if (!budgets[cat]) return null;
                const spent = expensesByCategory[cat] || 0;
                const budget = budgets[cat];
                const percentage = (spent / budget) * 100;

                if (percentage > 100) return 'danger';
                if (percentage > 80) return 'warning';
                return 'normal';
            };

            return (
                <div>
                    <div className="header">
                        <div className="header-content">
                            <h1>💰 Οικογενειακά Οικονομικά</h1>
                            <div className="header-buttons">
                                {dropboxToken ? (
                                    <button className="header-btn" onClick={() => syncNow(false)} title="Συγχρονισμός τώρα">
                                        {syncStatus === 'syncing' ? '⏳ Sync...' : syncStatus === 'error' ? '⚠️ Dropbox' : '☁️ Synced'}
                                    </button>
                                ) : (
                                    <button className="header-btn" onClick={connectDropbox}>☁️ Σύνδεση Dropbox</button>
                                )}
                                <button className="header-btn" onClick={exportToExcel}>📊 Excel</button>
                                <button className="header-btn" onClick={exportToPDF}>📄 PDF</button>
                                <button className="header-btn" onClick={exportData}>💾 Backup</button>
                                <button className="header-btn" onClick={() => setShowImportModal(true)}>📥 Import</button>
                                <button className="header-btn" onClick={handleImportClick}>📁 Restore</button>
                                <input ref={excelInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelImport} style={{ display: 'none' }} />
                                {dropboxToken && <button className="header-btn" onClick={disconnectDropbox} title="Αποσύνδεση Dropbox">🔌</button>}
                                <input ref={fileInputRef} type="file" accept=".json" onChange={importData} style={{ display: 'none' }} />
                            </div>
                        </div>
                    </div>

                    <div className="main-content">
                        {message && (
                            <div className={`toast ${message.type}`}>
                                {message.type === 'success' ? '✅' : message.type === 'error' ? '⚠️' : 'ℹ️'}
                                <span>{message.text}</span>
                            </div>
                        )}

                        <div className="top-stats">
                            <div className="stat-card income">
                                <div className="stat-label">💚 Εισόδημα Μήνα</div>
                                <div className="stat-value">€{currentMonthIncome.toFixed(2)}</div>
                                <div className="stat-meta">
                                    <span>{currentMonthIncomes.length} κατάθεση</span>
                                    <span className="stat-badge positive">↑ 0%</span>
                                </div>
                            </div>

                            <div className="stat-card expense">
                                <div className="stat-label">❌ Έξοδα Μήνα</div>
                                <div className="stat-value">€{currentMonthExpense.toFixed(2)}</div>
                                <div className="stat-meta">
                                    <span>{currentMonthExpenses.length} έξοδα</span>
                                    <span className={`stat-badge ${currentMonthExpense > prevMonthExpense ? 'negative' : 'positive'}`}>
                                        {currentMonthExpense > prevMonthExpense ? '↑' : '↓'} {Math.abs(((currentMonthExpense - prevMonthExpense) / (prevMonthExpense || 1) * 100).toFixed(1))}%
                                    </span>
                                </div>
                            </div>

                            <div className="stat-card balance">
                                <div className="stat-label">📊 Υπόλοιπο Μήνα</div>
                                <div className="stat-value" style={{ color: currentMonthBalance >= 0 ? '#4caf50' : '#f44336' }}>
                                    €{currentMonthBalance.toFixed(2)}
                                </div>
                                <div className="stat-meta">
                                    <span>{currentMonthBalance >= 0 ? '✓ Αποταμίευση' : '✗ Έλλειμμα'}</span>
                                </div>
                            </div>

                            <div className="stat-card annual">
                                <div className="stat-label">📈 Ετήσιο Σύνολο</div>
                                <div className="stat-value">€{annualExpense.toFixed(2)}</div>
                                <div className="stat-meta">
                                    <span>Έτος: {currentYear}</span>
                                    <span className={`stat-badge ${annualBalance >= 0 ? 'positive' : 'negative'}`}>
                                        {annualBalance >= 0 ? '✓' : '✗'} €{annualBalance.toFixed(2)}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div className="month-selector">
                            <label style={{ fontWeight: 600, color: '#667eea' }}>📅 Επιλέξτε Μήνα:</label>
                            <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} />
                        </div>

                        <div className="tabs">
                            <button className={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>📊 Ταμπλό</button>
                            <button className={`tab-btn ${activeTab === 'budgets' ? 'active' : ''}`} onClick={() => setActiveTab('budgets')}>💼 Προϋπολογισμός</button>
                            <button className={`tab-btn ${activeTab === 'analytics' ? 'active' : ''}`} onClick={() => setActiveTab('analytics')}>📈 Προχ. Ανάλυση</button>
                            <button className={`tab-btn ${activeTab === 'daily' ? 'active' : ''}`} onClick={() => setActiveTab('daily')}>📅 Ημερήσια</button>
                            <button className={`tab-btn ${activeTab === 'monthly' ? 'active' : ''}`} onClick={() => setActiveTab('monthly')}>📆 Μηνιαία</button>
                            <button className={`tab-btn ${activeTab === 'list' ? 'active' : ''}`} onClick={() => setActiveTab('list')}>📝 Λίστα</button>
                        </div>

                        {activeTab === 'dashboard' && (
                            <>
                                <div className="chart-grid">
                                    <div className="chart-card">
                                        <h2>📈 Τάσεις (12 Μήνες)</h2>
                                        <div className="chart-container">
                                            <canvas ref={el => chartRefs.current.trend = el}></canvas>
                                        </div>
                                    </div>

                                    <div className="chart-card">
                                        <h2>🎯 Κατηγορίες</h2>
                                        <div className="chart-container">
                                            <canvas ref={el => chartRefs.current.category = el}></canvas>
                                        </div>
                                    </div>

                                    <div className="chart-card">
                                        <h2>👥 Ανά Άτομο</h2>
                                        <div className="chart-container">
                                            <canvas ref={el => chartRefs.current.person = el}></canvas>
                                        </div>
                                    </div>
                                </div>

                                <div className="insights-grid">
                                    <div className="insight-card">
                                        <div className="insight-title">💵 Μέσο/Ημέρα</div>
                                        <div className="insight-value">€{dailyAverage}</div>
                                        <div className="insight-meta">Σύνολο ÷ Αριθμός εξόδων</div>
                                    </div>

                                    <div className="insight-card">
                                        <div className="insight-title">🔝 Μεγαλύτερο Έξοδο</div>
                                        <div className="insight-value">€{topExpense}</div>
                                        <div className="insight-meta">Μέγιστο ποσό αγοράς</div>
                                    </div>

                                    <div className="insight-card">
                                        <div className="insight-title">📊 Μέσο/Κατηγορία</div>
                                        <div className="insight-value">€{avgPerCategory}</div>
                                        <div className="insight-meta">Σύνολο ÷ Κατηγορίες</div>
                                    </div>

                                    <div className="insight-card">
                                        <div className="insight-title">📅 Ημέρες</div>
                                        <div className="insight-value">{currentMonthExpenses.length}</div>
                                        <div className="insight-meta">Ημέρες με δαπάνες</div>
                                    </div>

                                    <div className="insight-card">
                                        <div className="insight-title">📈 Εβδ. Μέσο</div>
                                        <div className="insight-value">€{weeklyAverage}</div>
                                        <div className="insight-meta">Ανά εβδομάδα</div>
                                    </div>
                                </div>

                                <div className="card" style={{ marginTop: '40px' }}>
                                    <h2>💳 Κατηγορίες - {new Date(selectedMonth + '-01').toLocaleDateString('el-GR', { month: 'long', year: 'numeric' })}</h2>
                                    <table>
                                        <thead>
                                            <tr>

                                        </thead>
                                        <tbody>
                                            {Object.entries(expensesByCategory).sort((a, b) => b[1] - a[1]).map(([cat, total], idx) => {
                                                const pct = currentMonthExpense > 0 ? ((total / currentMonthExpense) * 100).toFixed(1) : 0;
                                                return (
                                                    <tr key={cat}>
                                                        <td>
                                                            <div className="category-name">
                                                                <span className="category-dot" style={{ backgroundColor: COLORS[idx % COLORS.length] }}></span>
                                                                {cat}

                                                        </td>
                                                        <td><span className="amount-negative">€{total.toFixed(2)}</span></td>
                                                        <td>{pct}%</td>
                                                        <td>
                                                            <div className="progress-bar">
                                                                <div className="progress-fill" style={{ backgroundColor: COLORS[idx % COLORS.length], width: pct + '%' }}></div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </>
                        )}

                        {activeTab === 'add' && (
                            <div className="card">
                                <div style={{ display: 'flex', gap: '24px', marginBottom: '18px', flexWrap: 'wrap' }}>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer', fontWeight: 600 }}>
                                        <input type="radio" checked={isExpense} onChange={() => setIsExpense(true)} />
                                        ❌ Έξοδο
                                    </label>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer', fontWeight: 600 }}>
                                        <input type="radio" checked={!isExpense} onChange={() => setIsExpense(false)} />
                                        💚 Εισόδημα
                                    </label>
                                </div>

                                {isExpense && (
                                    <>
                                        {/* 1. AMOUNT - big, first */}
                                        <input
                                            type="number"
                                            inputMode="decimal"
                                            className="quick-amount"
                                            placeholder="€ 0.00"
                                            value={amount}
                                            onChange={e => setAmount(e.target.value)}
                                            step="0.01"
                                            autoFocus
                                        />

                                        {/* 2. CATEGORY - compact grid */}
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                                            <h3 style={{ margin: 0 }}>Κατηγορία</h3>
                                            <button onClick={() => setManageCats(!manageCats)} style={{ width: 'auto', padding: '4px 12px', fontSize: '11px', background: manageCats ? '#f44336' : '#999', marginBottom: 0 }}>
                                                {manageCats ? '✓ Τέλος' : '✏️ Διαχείριση'}
                                            </button>
                                        </div>
                                        <div className="quick-cats">
                                            {EXPENSE_CATEGORIES.map(cat => {
                                                const isCustom = customCategories.includes(cat);
                                                return (
                                                    <button
                                                        key={cat}
                                                        className={`quick-cat ${isCustom ? 'custom' : ''} ${manageCats ? 'manage' : ''} ${category === cat && !customCategory ? 'selected' : ''}`}
                                                        onClick={() => { if (!manageCats) { setCategory(cat); setCustomCategory(''); } }}
                                                    >
                                                        {cat}

                                                            <span className="del-x" onClick={(e) => { e.stopPropagation(); deleteCustomCategory(cat); }}>✕</span>

                                            <button onClick={addCustomCategory} style={{ width: 'auto', padding: '0 20px', marginBottom: 0 }}>Προσθήκη</button>

                                        <div style={{ textAlign: 'center', marginTop: '14px' }}>

                                <h3 style={{ marginBottom: '8px' }}>👤 Ποιος</h3>
                                <div className="quick-people" style={{ marginBottom: '14px' }}>
                                    {PEOPLE.map(p => (
                                        <button key={p.id} className={`quick-person ${person === p.id ? 'selected' : ''}`} onClick={() => setPerson(p.id)}>
                                            {p.name}
                                        </button>
                                    ))}
                                </div>

                                {/* Date + description */}
                                <h3 style={{ marginBottom: '8px' }}>📅 Ημερομηνία</h3>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ marginBottom: '12px' }} />
                                <h3 style={{ marginBottom: '8px' }}>📝 Περιγραφή</h3>
                                <textarea placeholder="π.χ. Μισθός Ιανουαρίου, bonus, ενοίκιο..." value={note} onChange={e => setNote(e.target.value)} style={{ marginBottom: '4px' }}></textarea>
                                  </>
                                )}

                                {/* Submit */}
                                <button onClick={submitFab} className="quick-submit" disabled={receiptUploading}>
                                    {receiptUploading ? '⏳ Ανέβασμα...' : (isExpense ? '✓ Καταχώρηση Εξόδου' : '💚 Καταχώρηση Εσόδου')}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ===== EXCEL IMPORT MODAL ===== */}
                    {showImportModal && (
                        <div className="fab-overlay" style={{ alignItems: 'center', padding: '20px' }} onClick={() => { setShowImportModal(false); setImportPreview(null); }}>
                            <div className="fab-sheet" style={{ borderRadius: '16px', maxWidth: '640px' }} onClick={e => e.stopPropagation()}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                                    <h2 style={{ margin: 0, fontSize: '20px' }}>📥 Εισαγωγή από Excel</h2>
                                    <button onClick={() => { setShowImportModal(false); setImportPreview(null); }} style={{ width: 'auto', background: 'none', color: '#999', fontSize: '26px', boxShadow: 'none', padding: 0, marginBottom: 0 }}>×</button>
                                </div>

                                {!importPreview ? (
                                    <div>
                                        <p style={{ color: '#666', fontSize: '14px', lineHeight: 1.6, marginBottom: '16px' }}>
                                            Ανέβασε αρχείο Excel/CSV με στήλες <strong>date</strong>, <strong>amount</strong>, <strong>description</strong>.
                                            Η περιγραφή αντιστοιχίζεται αυτόματα σε κατηγορία όπου γίνεται (π.χ. supermarket → Σούπερμάρκετ), αλλιώς κρατιέται ως σημείωση. Όλα μπαίνουν ως «Οικογένεια».
                                        </p>
                                        <div style={{ background: '#f8f9ff', border: '2px dashed #667eea', borderRadius: '12px', padding: '28px', textAlign: 'center' }}>
                                            <div style={{ fontSize: '38px', marginBottom: '10px' }}>📄</div>
                                            <button onClick={() => excelInputRef.current.click()} style={{ width: 'auto', padding: '12px 26px', fontSize: '15px' }}>Επιλογή Αρχείου</button>
                                        </div>
                                        <div style={{ marginTop: '14px', background: '#fffde7', padding: '12px', borderRadius: '8px', fontSize: '12px', color: '#666', lineHeight: 1.6 }}>
                                            💡 Δεκτές ημερομηνίες: 2026-01-02, 02/01/2026, 02.01.2026. Ποσά με € και κόμμα (230,0) ή τελεία.
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div style={{ display: 'flex', gap: '10px', marginBottom: '14px', flexWrap: 'wrap' }}>
                                            <div style={{ flex: 1, minWidth: '110px', background: '#e8f5e9', padding: '12px', borderRadius: '8px', textAlign: 'center' }}>
                                                <div style={{ fontSize: '26px', fontWeight: 800, color: '#2e7d32' }}>{importPreview.rows.length}</div>
                                                <div style={{ fontSize: '11px', color: '#666' }}>Έξοδα προς εισαγωγή</div>
                                            </div>
                                            <div style={{ flex: 1, minWidth: '110px', background: '#e3f2fd', padding: '12px', borderRadius: '8px', textAlign: 'center' }}>
                                                <div style={{ fontSize: '26px', fontWeight: 800, color: '#1565c0' }}>{importPreview.matched}</div>
                                                <div style={{ fontSize: '11px', color: '#666' }}>Βρήκαν κατηγορία</div>
                                            </div>
                                            <div style={{ flex: 1, minWidth: '110px', background: '#fff3e0', padding: '12px', borderRadius: '8px', textAlign: 'center' }}>
                                                <div style={{ fontSize: '26px', fontWeight: 800, color: '#e65100' }}>{importPreview.asNote}</div>
                                                <div style={{ fontSize: '11px', color: '#666' }}>Ως «Διάφορα»+σημείωση</div>
                                            </div>
                                        </div>

                                        <div style={{ maxHeight: '260px', overflow: 'auto', border: '1px solid #e0e0e0', borderRadius: '8px', marginBottom: '14px' }}>
                                            <table style={{ margin: 0 }}>
                                                <thead>
                                                    <tr>
                                                        <th>Ημ/νία</th>
                                                        <th>Ποσό</th>
                                                        <th>Κατηγορία</th>
                                                        <th>Σημείωση</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {importPreview.rows.slice(0, 60).map((r, i) => (
                                                        <tr key={i}>
                                                            <td>{r.date}</td>
                                                            <td><span className="amount-negative">€{r.amount.toFixed(2)}</span></td>
                                                            <td>{r.category}</td>
                                                            <td style={{ fontSize: '12px', color: '#888' }}>{r.note}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            {importPreview.rows.length > 60 && (
                                                <div style={{ padding: '10px', textAlign: 'center', color: '#999', fontSize: '12px' }}>...και {importPreview.rows.length - 60} ακόμα</div>
                                            )}
                                        </div>

                                        <div style={{ display: 'flex', gap: '10px' }}>
                                            <button onClick={confirmImport} className="quick-submit" style={{ flex: 1, marginTop: 0 }}>✓ Εισαγωγή {importPreview.rows.length} εξόδων</button>
                                            <button onClick={() => setImportPreview(null)} style={{ flex: 0.4, background: '#f0f0f0', color: '#333', marginBottom: 0 }}>← Πίσω</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ===== EDIT MODAL ===== */}
                    {editItem && (
                        <div className="fab-overlay" style={{ alignItems: 'center', padding: '20px' }} onClick={() => setEditItem(null)}>
                            <div className="fab-sheet" style={{ borderRadius: '16px', maxWidth: '480px' }} onClick={e => e.stopPropagation()}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                                    <h2 style={{ margin: 0, fontSize: '20px' }}>✏️ Επεξεργασία {editItem.type === 'expense' ? 'Εξόδου' : 'Εσόδου'}</h2>
                                    <button onClick={() => setEditItem(null)} style={{ width: 'auto', background: 'none', color: '#999', fontSize: '26px', boxShadow: 'none', padding: 0, marginBottom: 0 }}>×</button>
                                </div>

                                <h3 style={{ marginBottom: '6px' }}>Ποσό (€)</h3>
                                <input type="number" inputMode="decimal" value={editItem.amount} onChange={e => setEditItem({ ...editItem, amount: e.target.value })} step="0.01" style={{ marginBottom: '12px' }} />

                                <h3 style={{ marginBottom: '6px' }}>Κατηγορία</h3>
                                <select value={editItem.category} onChange={e => setEditItem({ ...editItem, category: e.target.value })} style={{ marginBottom: '12px' }}>
                                    {(editItem.type === 'expense' ? EXPENSE_CATEGORIES : INCOME_CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                                    {/* keep current value even if it's a one-off not in the list */}
                                    {!(editItem.type === 'expense' ? EXPENSE_CATEGORIES : INCOME_CATEGORIES).includes(editItem.category) && <option value={editItem.category}>{editItem.category}</option>}
                                </select>

                                <h3 style={{ marginBottom: '6px' }}>👤 {editItem.type === 'expense' ? 'Χρεώνω' : 'Ποιος'}</h3>
                                <div className="quick-people" style={{ marginBottom: '12px' }}>
                                    {PEOPLE.map(p => (
                                        <button key={p.id} className={`quick-person ${editItem.person === p.id ? 'selected' : ''}`} onClick={() => setEditItem({ ...editItem, person: p.id })}>
                                            {p.name}
                                        </button>
                                    ))}
                                </div>

                                <h3 style={{ marginBottom: '6px' }}>📅 Ημερομηνία</h3>
                                <input type="date" value={editItem.date} onChange={e => setEditItem({ ...editItem, date: e.target.value })} style={{ marginBottom: '12px' }} />

                                <h3 style={{ marginBottom: '6px' }}>📝 {editItem.type === 'expense' ? 'Σημείωση' : 'Περιγραφή'}</h3>
                                <textarea value={editItem.note || ''} onChange={e => setEditItem({ ...editItem, note: e.target.value })} style={{ marginBottom: '16px' }}></textarea>

                                <div style={{ display: 'flex', gap: '10px' }}>
                                    <button onClick={saveEdit} className="quick-submit" style={{ flex: 1, marginTop: 0 }}>💾 Αποθήκευση</button>
                                    <button onClick={() => setEditItem(null)} style={{ flex: 0.4, background: '#f0f0f0', color: '#333', marginBottom: 0 }}>Ακύρωση</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ===== RECEIPT VIEWER ===== */}
                    {viewingReceipt && (
                        <div className="fab-overlay" style={{ alignItems: 'center', padding: '20px' }} onClick={() => setViewingReceipt(null)}>
                            <div onClick={e => e.stopPropagation()} style={{ background: 'white', borderRadius: '16px', padding: '16px', maxWidth: '90vw', maxHeight: '90vh', overflow: 'auto', textAlign: 'center' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                                    <h3 style={{ margin: 0 }}>📎 Απόδειξη</h3>
                                    <button onClick={() => setViewingReceipt(null)} style={{ width: 'auto', background: 'none', color: '#999', fontSize: '24px', boxShadow: 'none', padding: 0, marginBottom: 0 }}>×</button>
                                </div>
                                {viewingReceipt.loading ? (
                                    <div style={{ padding: '60px', color: '#999' }}>⏳ Φόρτωση...</div>
                                ) : (
                                    <>
                                        <img src={viewingReceipt.url} alt="απόδειξη" style={{ maxWidth: '100%', maxHeight: '75vh', borderRadius: '10px' }} />
                                        <div style={{ marginTop: '12px' }}>
                                            <a href={viewingReceipt.url} download="apodeixi.jpg" style={{ display: 'inline-block', textDecoration: 'none' }}>
                                                <button style={{ width: 'auto', padding: '10px 20px', marginBottom: 0 }}>⬇️ Λήψη</button>
                                            </a>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ExpenseTracker />);
    </script>
</body>
</html>
